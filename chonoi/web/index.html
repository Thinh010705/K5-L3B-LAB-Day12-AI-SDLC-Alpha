<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Út Sen Rạch Sen</title>
<style>
  :root {
    --wood-dark: rgba(33, 21, 13, 0.86);
    --wood-mid: rgba(58, 36, 20, 0.88);
    --wood-border: rgba(235, 190, 120, 0.42);
    --gold: #ffd46b;
    --cream: #fff5e1;
    --muted: #d6c3a5;
    --danger: #ff6b6b;
    --ok: #6ee7a8;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0d161b;
    color: var(--cream);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  /* Floating utility buttons (top-right) */
  .ui-actions {
    position: fixed;
    top: 10px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .ui-btn {
    background: var(--wood-dark);
    color: var(--cream);
    border: 1px solid var(--wood-border);
    border-radius: 10px;
    padding: 6px 11px;
    font: 600 12px/1 "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .ui-btn:hover {
    background: var(--wood-mid);
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .ui-btn:active { transform: translateY(0); }
  .ui-btn.active { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui-actions">
  <button id="btn-sound" class="ui-btn" title="Bật/tắt âm thanh (M)">🔊 Âm thanh</button>
  <button id="btn-log" class="ui-btn" title="Hiện/ẩn nhật ký sự kiện (H)">📜 Nhật ký</button>
  <button id="btn-restart" class="ui-btn" title="Chơi lại từ đầu (R)">↻ Chơi lại</button>
</div>
<script>
"use strict";
/*
 * Client chơi trực tiếp — Quán Ăn Chợ Nổi (Nhóm Alpha · Module client/ui).
 *
 * Nguyên tắc hợp đồng sim/* <-> client/ui:
 * - CHỈ ĐỌC snapshot từ GET /state và gửi input qua POST /input, POST /restart.
 * - Mọi trường snapshot chưa có sẽ được bỏ qua an toàn (tương thích khi code song song).
 * - Không chứa logic chấm điểm/luật chơi; toàn bộ hiệu ứng, âm thanh, hoạt ảnh chỉ là lớp hiển thị.
 * - Phím: WASD / Mũi tên = di chuyển · E = tương tác · Space = bắt cá · R = chơi lại · M = âm thanh · H = nhật ký.
 */

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

let snap = null;
let offline = false;
let showLog = false;
let soundEnabled = true;
let animTime = 0;
let lastFrameTs = performance.now();

// ---------- Từ điển hiển thị miền Tây ----------
const KIND_INFO = {
  ca_loc:         { name: "Cá lóc",       short: "C.Lóc",      color: "#6b8e4e", accent: "#3f572c" },
  ca_linh:        { name: "Cá linh",      short: "C.Linh",     color: "#cfe4f2", accent: "#6b99b8" },
  ca_keo:         { name: "Cá kèo",       short: "C.Kèo",      color: "#c99660", accent: "#785028" },
  bong_dien_dien: { name: "Điên điển",    short: "Điên điển",  color: "#f5c733", accent: "#d18b00" },
  bong_sung:      { name: "Bông súng",    short: "Bông súng",  color: "#f07ca4", accent: "#b83b6a" },
  keo_neo:        { name: "Kèo nèo",      short: "Kèo nèo",    color: "#89c964", accent: "#4c8532" },
};

const DISH_INFO = {
  ca_loc_nuong_trui: {
    name: "Cá lóc nướng trui",
    short: "Cá lóc nướng",
    recipe: { ca_loc: 1 },
    cook_s: 6,
    price: 60,
    color: "#d9823b",
  },
  goi_bong_sung: {
    name: "Gỏi bông súng",
    short: "Gỏi bông súng",
    recipe: { bong_sung: 2 },
    cook_s: 4,
    price: 40,
    color: "#eb7aa3",
  },
  lau_ca_linh_dien_dien: {
    name: "Lẩu cá linh điên điển",
    short: "Lẩu cá linh",
    recipe: { ca_linh: 3, bong_dien_dien: 1 },
    cook_s: 10,
    price: 120,
    color: "#f2be38",
  },
};

const REASON_VI = {
  docked: "Đã cập bến giao hàng an toàn!",
  time: "Đã hết thời gian của buổi!",
  fainted: "Út Sen ngất do ngạt nước — rớt hết giỏ!",
  tick_limit: "Chạm giới hạn bước mô phỏng",
  error: "Có lỗi trong mô phỏng",
};

function kindName(k) { return (KIND_INFO[k] && KIND_INFO[k].name) || k; }
function kindColor(k) { return (KIND_INFO[k] && KIND_INFO[k].color) || "#c7c7c7"; }
function dishIdOf(obj) {
  if (!obj) return null;
  if (typeof obj === "string") return obj;
  return obj.dish_id || obj.id || null;
}
function dishName(id, short = false) {
  const info = DISH_INFO[id];
  if (!info) return id || "Món ăn";
  return short ? info.short : info.name;
}

// ---------- Web Audio API (âm thanh tổng hợp thuần, không cần file ngoài) ----------
let audioCtx = null;
function unlockAudio() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* bỏ qua nếu trình duyệt chặn */ }
}
function playTone(freq, dur, type = "sine", vol = 0.08, endFreq = null, delay = 0) {
  if (!soundEnabled || !audioCtx || audioCtx.state !== "running") return;
  try {
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  } catch (e) {}
}
const SFX = {
  splash: () => { playTone(280, 0.16, "triangle", 0.07, 110); playTone(520, 0.12, "sine", 0.04, 240, 0.03); },
  gather: () => { playTone(520, 0.09, "sine", 0.07, 740); playTone(780, 0.12, "triangle", 0.06, 980, 0.07); },
  catchFish: () => { playTone(440, 0.08, "triangle", 0.08, 660); playTone(660, 0.1, "triangle", 0.08, 880, 0.07); playTone(880, 0.15, "sine", 0.07, 1100, 0.14); },
  warn: () => { playTone(210, 0.14, "sawtooth", 0.05, 160); },
  choke: () => { playTone(160, 0.22, "sawtooth", 0.09, 90); playTone(120, 0.22, "square", 0.05, 70, 0.12); },
  cook: () => { playTone(320, 0.12, "triangle", 0.06, 480); },
  ready: () => { playTone(880, 0.14, "sine", 0.08, 880); playTone(1174, 0.22, "sine", 0.07, 1174, 0.1); },
  serve: () => { playTone(587, 0.09, "sine", 0.07, 784); },
  paid: (hasTip) => {
    playTone(784, 0.09, "sine", 0.08, 988);
    playTone(1046, 0.14, "sine", 0.08, 1318, 0.08);
    if (hasTip) playTone(1568, 0.22, "triangle", 0.08, 1760, 0.16);
  },
  left: () => { playTone(340, 0.14, "triangle", 0.07, 220); playTone(220, 0.2, "triangle", 0.07, 150, 0.12); },
};

// ---------- Nút UI ----------
const btnSound = document.getElementById("btn-sound");
const btnLog = document.getElementById("btn-log");
const btnRestart = document.getElementById("btn-restart");
function syncButtons() {
  btnSound.textContent = soundEnabled ? "🔊 Âm thanh" : "🔇 Tắt tiếng";
  btnSound.classList.toggle("active", soundEnabled);
  btnLog.classList.toggle("active", showLog);
}
btnSound.addEventListener("click", () => { soundEnabled = !soundEnabled; if (soundEnabled) unlockAudio(); syncButtons(); });
btnLog.addEventListener("click", () => { showLog = !showLog; syncButtons(); });
btnRestart.addEventListener("click", () => doRestart());
syncButtons();

// ---------- Input bàn phím ----------
const down = new Set();
const MOVE_KEYS = {
  w: "u", arrowup: "u",
  s: "d", arrowdown: "d",
  a: "l", arrowleft: "l",
  d: "r", arrowright: "r",
};
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0); // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                              // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try {
      await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } });
    } catch (e) { /* poll sẽ báo mất kết nối */ }
  }
  inflight = false;
}
function doRestart() {
  fetch("/restart", { method: "POST" }).catch(() => {});
  lastSent = "";
  down.clear();
  resetEffects();
}
addEventListener("keydown", (e) => {
  unlockAudio();
  const k = e.key.toLowerCase();
  if (e.repeat) {
    if (k === " " || k.startsWith("arrow")) e.preventDefault();
    return;
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { doRestart(); return; }
  else if (k === "m") { soundEnabled = !soundEnabled; syncButtons(); return; }
  else if (k === "h") { showLog = !showLog; syncButtons(); return; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
addEventListener("pointerdown", () => unlockAudio());

// ---------- Hiệu ứng hạt, chữ bay, câu thoại Nam Bộ ----------
const particles = [];
const floaters = [];
let toast = null; // { text, sub, color, ttl, maxTtl }
let screenShake = 0;
let lastEventSig = "";
let lastSeenTick = -1;
let seenEventsSet = new Set();
let lastQuanFacing = 0; // radian hướng nhìn của Út Sen trong quán
let lastQuanPos = null;

function resetEffects() {
  particles.length = 0;
  floaters.length = 0;
  toast = null;
  screenShake = 0;
  lastEventSig = "";
  lastSeenTick = -1;
  seenEventsSet.clear();
  lastQuanPos = null;
}

function showToast(text, sub = "", color = "#ffd46b", dur = 2.8) {
  toast = { text, sub, color, ttl: dur, maxTtl: dur };
}
function addFloater(wx, wy, text, color = "#fff5e1", size = 14) {
  floaters.push({ wx, wy, text, color, size, ttl: 1.5, maxTtl: 1.5 });
}
function spawnParticles(wx, wy, count, opts = {}) {
  for (let i = 0; i < count; i++) {
    const ang = opts.angle !== undefined
      ? opts.angle + (Math.random() - 0.5) * (opts.spread || 1.2)
      : Math.random() * Math.PI * 2;
    const spd = (opts.speed || 1.5) * (0.4 + Math.random() * 0.9);
    particles.push({
      wx, wy,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: (opts.radius || 3) * (0.6 + Math.random() * 0.8),
      color: opts.color || "rgba(255,255,255,0.7)",
      gravity: opts.gravity || 0,
      ttl: (opts.life || 0.8) * (0.7 + Math.random() * 0.6),
      maxTtl: opts.life || 0.8,
      kind: opts.kind || "dot",
    });
  }
}

function processNewEvents(s) {
  if (!s) return;
  if (s.tick < lastSeenTick) {
    resetEffects();
  }
  lastSeenTick = s.tick;
  const evs = s.events || [];
  const ppos = s.player && s.player.pos ? s.player.pos : [0, 0];

  evs.forEach((ev, idx) => {
    const key = `${ev.tick}|${ev.name}|${JSON.stringify(ev.data || {})}|${idx}`;
    if (seenEventsSet.has(key)) return;
    seenEventsSet.add(key);
    if (seenEventsSet.size > 200) {
      const first = seenEventsSet.values().next().value;
      seenEventsSet.delete(first);
    }
    const d = ev.data || {};
    const name = ev.name;
    if (name === "dive") {
      SFX.splash();
      spawnParticles(ppos[0], 0, 12, { color: "rgba(235,248,255,0.85)", speed: 2.2, angle: -Math.PI / 2, spread: 1.8, gravity: 5, life: 0.65, radius: 3 });
    } else if (name === "surface") {
      SFX.splash();
      spawnParticles(ppos[0], 0, 10, { color: "rgba(255,248,220,0.9)", speed: 2.0, angle: -Math.PI / 2, spread: 1.8, gravity: 5, life: 0.6, radius: 3 });
      showToast("Phù! Ngoi lên thở cái đã!", "", "#7de2ff", 1.8);
    } else if (name === "gather") {
      SFX.gather();
      addFloater(ppos[0], ppos[1] - 1.2, `+${d.amount || 1} ${kindName(d.kind)}`, kindColor(d.kind), 15);
      spawnParticles(ppos[0], ppos[1], 10, { color: kindColor(d.kind), speed: 2.5, life: 0.7, radius: 3.5 });
      showToast(`${kindName(d.kind)} tươi rói luôn nè!`, "Đã bỏ vô giỏ lưới", kindColor(d.kind), 2.1);
    } else if (name === "fish_caught") {
      SFX.catchFish();
      addFloater(ppos[0], ppos[1] - 1.2, `+${d.yield || 1} ${kindName(d.kind)}!`, "#ffe680", 16);
      spawnParticles(ppos[0], ppos[1], 16, { color: "#d8f3ff", speed: 3.2, life: 0.75, radius: 3.5 });
      showToast(`Trúng mánh ${d.yield || 1} ${kindName(d.kind)} rồi!`, "Mê chữ ê kéo dài luôn!", "#ffe680", 2.4);
    } else if (name === "hold_full") {
      SFX.warn();
      screenShake = 5;
      addFloater(ppos[0], ppos[1] - 1.2, "Giỏ đầy rồi!", "#ff8a80", 15);
      showToast("Giỏ lưới đầy ứ hự rồi Út ơi!", `Cần ${d.required || "?"} ô, chỉ còn ${d.free ?? 0} ô — về bến giao hàng thôi!`, "#ff9e80", 2.8);
    } else if (name === "oxygen_empty") {
      SFX.warn();
      showToast("Hết hơi rồi! Ngoi lên mặt nước lẹ!", "Đứng dưới nước sẽ bị ngạt trừ Máu", "#ff6b6b", 2.6);
    } else if (name === "choke") {
      SFX.choke();
      screenShake = 11;
      addFloater(ppos[0], ppos[1] - 1.2, "-1 ♥ Ngạt!", "#ff5252", 16);
      showToast("Sặc nước rồi! Ngoi lên mặt nước mau!", `Còn ${d.hp ?? "?"} Máu`, "#ff5252", 2.5);
    } else if (name === "faint") {
      SFX.choke();
      screenShake = 14;
      showToast("Út Sen xỉu ngang do ngạt nước...", "Giỏ hàng bị trôi mất hết trơn!", "#ff5252", 4.0);
    } else if (name === "node_regrown") {
      addFloater(ppos[0], 0.5, "", "#a5f3c0", 12);
    } else if (name === "customer_arrived") {
      SFX.serve();
      showToast(`Khách mới vô bàn ${d.table_id || ""}!`, `Gọi món: ${dishName(d.dish_id)}`, "#ffd46b", 2.4);
    } else if (name === "no_dish") {
      SFX.warn();
      showToast("Khách ghé mà hết nguyên liệu nấu rồi!", "Kho khả dụng không đủ công thức nào", "#ffab73", 2.8);
    } else if (name === "cook_started") {
      SFX.cook();
      addFloater(ppos[0], ppos[1] + 0.8, `Nấu ${dishName(d.dish_id, true)}`, "#ffb74d", 14);
      showToast(`Lên lửa món ${dishName(d.dish_id)}!`, `Bếp ${d.stove_id || ""}`, "#ffb74d", 2.0);
    } else if (name === "dish_ready") {
      SFX.ready();
      showToast(`${dishName(d.dish_id)} chín thơm phức rồi!`, `Lại bếp ${d.stove_id || ""} bấm [E] bưng ra`, "#7ef5a2", 2.5);
    } else if (name === "dish_picked") {
      SFX.serve();
      addFloater(ppos[0], ppos[1] + 0.8, `Bưng ${dishName(d.dish_id, true)}`, "#fff3b0", 14);
    } else if (name === "served") {
      SFX.serve();
      const tipMsg = (d.tip || 0) > 0 ? `Phục vụ nhanh — có boa +${d.tip}k!` : "Chúc cô chú ăn ngon miệng nghen!";
      addFloater(ppos[0], ppos[1] + 0.8, "Đã lên món!", "#80f0a8", 15);
      showToast(`Đã bưng ${dishName(d.dish_id)} tới bàn ${d.table_id || ""}!`, tipMsg, "#80f0a8", 2.4);
    } else if (name === "paid") {
      const hasTip = (d.tip || 0) > 0;
      SFX.paid(hasTip);
      const txt = hasTip ? `+${d.amount}k (boa ${d.tip}k ★)` : `+${d.amount}k`;
      addFloater(ppos[0], ppos[1] + 0.9, txt, hasTip ? "#ffe066" : "#a8f5b8", 16);
      showToast(`Khách bàn ${d.table_id || ""} trả ${d.amount}k!`, hasTip ? `Khen ngon, thưởng thêm ${d.tip}k boa!` : "Cảm ơn quý khách ghé quán Má Tư!", "#ffe066", 2.6);
    } else if (name === "customer_left") {
      if (d.reason === "patience") {
        SFX.left();
        screenShake = 7;
        addFloater(ppos[0], ppos[1] + 0.8, "Khách bỏ đi! -★", "#ff6b6b", 15);
        showToast(`Khách bàn ${d.table_id || ""} đợi lâu quá bỏ đi rồi!`, `Uy tín còn ${typeof d.reputation === "number" ? d.reputation.toFixed(1) : "?"}`, "#ff6b6b", 2.8);
      }
    }
  });
}

// ---------- Poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    processNewEvents(snap);
  } catch (e) {
    offline = true;
  }
  setTimeout(poll, 16);
}
poll();

// ---------- Tiện ích vẽ Canvas ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function panel(x, y, w, h, r = 12, fill = "rgba(31, 19, 12, 0.82)", stroke = "rgba(235, 190, 120, 0.42)") {
  roundRectPath(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
}

function text(s, x, y, o = {}) {
  const weight = o.bold ? "700 " : o.medium ? "600 " : "";
  ctx.font = `${weight}${o.size || 14}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillText(s, x + 1, y + 1.5);
  }
  ctx.fillStyle = o.color || "#fff5e1";
  ctx.fillText(s, x, y);
}

function progressBar(x, y, w, h, frac, color, label, opts = {}) {
  const f = Math.max(0, Math.min(1, frac));
  roundRectPath(x, y, w, h, h / 2);
  ctx.fillStyle = opts.bg || "rgba(0,0,0,0.48)";
  ctx.fill();
  if (f > 0) {
    ctx.save();
    roundRectPath(x, y, w, h, h / 2);
    ctx.clip();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * f, h);
    // ánh sáng phía trên thanh
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.fillRect(x, y, w * f, h * 0.42);
    ctx.restore();
  }
  if (opts.marker !== undefined) {
    const mx = x + w * opts.marker;
    ctx.strokeStyle = "#ffe066";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(mx, y - 1);
    ctx.lineTo(mx, y + h + 1);
    ctx.stroke();
  }
  roundRectPath(x, y, w, h, h / 2);
  ctx.strokeStyle = opts.border || "rgba(255,245,225,0.35)";
  ctx.lineWidth = 1;
  ctx.stroke();
  if (label) {
    text(label, x + w / 2, y + h / 2 + 1, { size: opts.fontSize || 11, align: "center", base: "middle", bold: true, shadow: true });
  }
}

function fmtTime(ticks) {
  const s = Math.max(0, Math.ceil((ticks || 0) / 60));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function dist2(a, b) {
  return Math.hypot((a[0] || 0) - (b[0] || 0), (a[1] || 0) - (b[1] || 0));
}

function idSortKey(id) {
  const m = String(id || "").match(/^(.*?)(\d+)$/);
  if (!m) return [String(id || ""), -1, String(id || "")];
  return [m[1], parseInt(m[2], 10), String(id || "")];
}
function cmpId(a, b) {
  const ka = idSortKey(a), kb = idSortKey(b);
  if (ka[0] !== kb[0]) return ka[0] < kb[0] ? -1 : 1;
  if (ka[1] !== kb[1]) return ka[1] - kb[1];
  return ka[2] < kb[2] ? -1 : ka[2] > kb[2] ? 1 : 0;
}

// Tính kho khả dụng = stock vật lý - tổng reserved của các khách
function computeStockBreakdown(s) {
  const phys = Object.assign({}, (s && s.stock) || {});
  const res = {};
  ((s && s.customers) || []).forEach((c) => {
    const r = c.reserved || {};
    Object.keys(r).forEach((k) => {
      res[k] = (res[k] || 0) + (r[k] || 0);
    });
  });
  const avail = {};
  const keys = new Set([...Object.keys(phys), ...Object.keys(res), "ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"]);
  keys.forEach((k) => {
    avail[k] = Math.max(0, (phys[k] || 0) - (res[k] || 0));
  });
  return { phys, res, avail };
}

// Vẽ icon nhỏ cho từng nguyên liệu / món
function drawIngredientIcon(x, y, r, kind) {
  ctx.save();
  ctx.translate(x, y);
  if (kind === "bong_dien_dien") {
    ctx.strokeStyle = "#3c7a36";
    ctx.lineWidth = Math.max(1.5, r * 0.22);
    ctx.beginPath(); ctx.moveTo(-r * 0.7, r * 0.5); ctx.quadraticCurveTo(0, -r * 0.2, r * 0.6, -r * 0.5); ctx.stroke();
    [[-0.3, 0.1], [0.05, -0.25], [0.4, -0.05], [-0.05, 0.3], [0.35, -0.45]].forEach(([bx, by]) => {
      ctx.fillStyle = "#ffd338";
      ctx.beginPath(); ctx.arc(bx * r, by * r, r * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e08b00";
      ctx.beginPath(); ctx.arc(bx * r, by * r, r * 0.1, 0, Math.PI * 2); ctx.fill();
    });
  } else if (kind === "bong_sung") {
    ctx.fillStyle = "#3c8044";
    ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.85, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = -2; i <= 2; i++) {
      ctx.save();
      ctx.rotate(i * 0.28);
      ctx.fillStyle = i % 2 === 0 ? "#f78cb3" : "#e35b8d";
      ctx.beginPath(); ctx.ellipse(0, -r * 0.18, r * 0.24, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = "#ffe066";
    ctx.beginPath(); ctx.arc(0, r * 0.05, r * 0.18, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "ca_linh") {
    ctx.fillStyle = "#d9edf7";
    ctx.beginPath(); ctx.ellipse(r * 0.05, 0, r * 0.65, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#79a8c4";
    ctx.beginPath(); ctx.moveTo(-r * 0.5, 0); ctx.lineTo(-r * 0.95, -r * 0.35); ctx.lineTo(-r * 0.95, r * 0.35); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#223";
    ctx.beginPath(); ctx.arc(r * 0.4, -r * 0.06, r * 0.09, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "ca_loc") {
    ctx.fillStyle = "#5f7d43";
    ctx.beginPath(); ctx.ellipse(r * 0.05, 0, r * 0.78, r * 0.36, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#304220";
    ctx.lineWidth = Math.max(1.2, r * 0.14);
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(i * r * 0.28, -r * 0.25); ctx.lineTo(i * r * 0.2, r * 0.2); ctx.stroke();
    }
    ctx.fillStyle = "#486330";
    ctx.beginPath(); ctx.moveTo(-r * 0.6, 0); ctx.lineTo(-r * 0.98, -r * 0.34); ctx.lineTo(-r * 0.98, r * 0.34); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffe082";
    ctx.beginPath(); ctx.arc(r * 0.52, -r * 0.08, r * 0.09, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = kindColor(kind);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawDishIcon(x, y, r, dishId) {
  ctx.save();
  ctx.translate(x, y);
  // Đĩa / nồi đất
  ctx.fillStyle = dishId === "lau_ca_linh_dien_dien" ? "#8c4a27" : "#f5ebd6";
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = dishId === "lau_ca_linh_dien_dien" ? "#542a14" : "#c7b28e";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (dishId === "ca_loc_nuong_trui") {
    // Lá chuối + cá lóc nướng vàng thơm
    ctx.fillStyle = "#4f8a42";
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.78, r * 0.52, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a85620";
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.65, r * 0.26, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#4a2009";
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.15); ctx.lineTo(-r * 0.15, r * 0.15); ctx.moveTo(0, -r * 0.18); ctx.lineTo(r * 0.15, r * 0.14); ctx.stroke();
    ctx.fillStyle = "#8bc34a";
    ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.25, r * 0.14, 0, Math.PI * 2); ctx.fill();
  } else if (dishId === "goi_bong_sung") {
    // Gỏi bông súng hồng trắng rau thơm
    ctx.fillStyle = "#f28eb1";
    ctx.beginPath(); ctx.arc(-r * 0.12, 0, r * 0.52, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff1e0";
    ctx.beginPath(); ctx.arc(r * 0.15, -r * 0.08, r * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#5cb85c";
    ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.22, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff7043";
    ctx.beginPath(); ctx.arc(r * 0.22, r * 0.18, r * 0.14, 0, Math.PI * 2); ctx.fill();
  } else if (dishId === "lau_ca_linh_dien_dien") {
    // Nồi lẩu nước vàng cam + bông điên điển + cá linh
    ctx.fillStyle = "#e07b28";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd640";
    [[-0.3, -0.2], [0.25, -0.25], [0.1, 0.3], [-0.25, 0.25]].forEach(([bx, by]) => {
      ctx.beginPath(); ctx.arc(bx * r, by * r, r * 0.16, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "#dceef7";
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.38, r * 0.15, 0.4, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = "#e6a84c";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawNipaPalm(x, baseY, scale, phase) {
  ctx.save();
  ctx.translate(x, baseY);
  const sway = Math.sin(animTime * 1.4 + phase) * 0.04;
  const fronds = [-0.95, -0.58, -0.22, 0.18, 0.55, 0.92];
  fronds.forEach((ang, idx) => {
    ctx.save();
    ctx.rotate(ang + sway * (idx % 2 ? 1.2 : 0.8));
    const len = scale * (idx === 2 || idx === 3 ? 1.05 : 0.86);
    ctx.strokeStyle = idx % 2 === 0 ? "#244d2a" : "#2f6336";
    ctx.lineWidth = Math.max(1.5, scale * 0.07);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.12, -len * 0.55, len * 0.38, -len);
    ctx.stroke();
    // Lá dừa nước xòe hai bên
    ctx.fillStyle = idx % 2 === 0 ? "#2e6132" : "#3d7a3f";
    for (let t = 0.25; t <= 0.92; t += 0.17) {
      const fx = len * (0.12 * 2 * (1 - t) * t + 0.38 * t * t);
      const fy = -len * (0.55 * 2 * (1 - t) * t + t * t);
      ctx.beginPath();
      ctx.ellipse(fx - scale * 0.1, fy, scale * 0.18, scale * 0.045, -0.5, 0, Math.PI * 2);
      ctx.ellipse(fx + scale * 0.1, fy, scale * 0.18, scale * 0.045, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
  ctx.restore();
}

function drawStiltHouse(x, waterY, s) {
  ctx.save();
  ctx.translate(x, waterY);
  // Cọc nhà sàn xuống mé nước
  ctx.strokeStyle = "#4d3420";
  ctx.lineWidth = Math.max(1.5, s * 0.2);
  [-2.2, -0.7, 0.7, 2.2].forEach((px) => {
    ctx.beginPath();
    ctx.moveTo(px * s, -1.2 * s);
    ctx.lineTo(px * s, 0.1 * s);
    ctx.stroke();
  });
  // Sàn gỗ + vách lá
  ctx.fillStyle = "#7a5332";
  ctx.fillRect(-2.6 * s, -1.4 * s, 5.2 * s, 0.35 * s);
  ctx.fillStyle = "#b58b58";
  ctx.fillRect(-2.2 * s, -3.1 * s, 4.4 * s, 1.7 * s);
  // Cửa sổ nhỏ sáng ấm
  ctx.fillStyle = "#ffd98a";
  ctx.fillRect(-1.3 * s, -2.5 * s, 0.75 * s, 0.7 * s);
  ctx.fillRect(0.6 * s, -2.5 * s, 0.75 * s, 0.7 * s);
  // Mái lá dừa
  ctx.fillStyle = "#6e4726";
  ctx.beginPath();
  ctx.moveTo(-3.1 * s, -3.0 * s);
  ctx.lineTo(0, -4.6 * s);
  ctx.lineTo(3.1 * s, -3.0 * s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#4a2d15";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();
}

function drawUtSenGather(px, py, s, p, hold) {
  const vx = (p.vel && p.vel[0]) || 0;
  const vy = (p.vel && p.vel[1]) || 0;
  const speed = Math.hypot(vx, vy);
  const headingRad = ((p.heading_deg || 0) * Math.PI) / 180;
  const facingLeft = Math.cos(headingRad) < -0.15;
  const kick = Math.sin(animTime * (speed > 0.3 ? 13 : 4)) * (speed > 0.3 ? 0.38 : 0.12);

  ctx.save();
  ctx.translate(px, py);
  const bodyAngle = facingLeft ? headingRad - Math.PI : headingRad;
  // Giữ góc nghiêng tự nhiên
  ctx.rotate(Math.max(-0.85, Math.min(0.85, Math.sin(bodyAngle) * 0.65)));
  if (facingLeft) ctx.scale(-1, 1);

  const u = Math.max(8, s * 0.75);

  // Khăn rằn Nam Bộ bay phấp phới phía sau cổ
  ctx.save();
  const wave = Math.sin(animTime * 8) * u * 0.14;
  ctx.strokeStyle = "#f2f2f2";
  ctx.lineWidth = u * 0.24;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-u * 0.05, -u * 0.18);
  ctx.quadraticCurveTo(-u * 0.55, -u * 0.38 + wave, -u * 0.95, -u * 0.15 - wave);
  ctx.stroke();
  ctx.strokeStyle = "#1c1c1c";
  ctx.setLineDash([u * 0.14, u * 0.14]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Giỏ lưới tre sau lưng (chứa màu nguyên liệu đã nhặt!)
  ctx.save();
  ctx.translate(-u * 0.42, -u * 0.34);
  ctx.rotate(-0.2);
  ctx.fillStyle = "#b58545";
  roundRectPath(-u * 0.3, -u * 0.22, u * 0.58, u * 0.44, u * 0.12);
  ctx.fill();
  ctx.strokeStyle = "#6e4a1f";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  if (hold && hold.length > 0) {
    const showN = Math.min(4, hold.length);
    for (let i = 0; i < showN; i++) {
      ctx.fillStyle = kindColor(hold[hold.length - 1 - i]);
      ctx.beginPath();
      ctx.arc(-u * 0.16 + i * u * 0.11, -u * 0.18, u * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // Hai chân đạp nước (quần đen bà ba)
  ctx.strokeStyle = "#22252b";
  ctx.lineWidth = u * 0.22;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-u * 0.55, u * 0.08);
  ctx.lineTo(-u * 1.05, u * (0.22 + kick));
  ctx.moveTo(-u * 0.55, u * 0.02);
  ctx.lineTo(-u * 1.02, u * (-0.08 - kick));
  ctx.stroke();

  // Thân áo bà ba (màu nâu đất ấm / hồng mận đặc trưng)
  ctx.fillStyle = "#c95b42";
  ctx.beginPath();
  ctx.ellipse(-u * 0.12, u * 0.02, u * 0.52, u * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#7a3020";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Tay quạt nước
  ctx.strokeStyle = "#f2c29b";
  ctx.lineWidth = u * 0.17;
  ctx.beginPath();
  ctx.moveTo(u * 0.12, u * 0.12);
  ctx.lineTo(u * 0.58, u * (0.28 - kick * 0.7));
  ctx.stroke();

  // Đầu & tóc búi gọn của Út Sen
  ctx.fillStyle = "#1f1815";
  ctx.beginPath();
  ctx.arc(u * 0.42, -u * 0.06, u * 0.34, 0, Math.PI * 2);
  ctx.fill();
  // Búi tóc nhỏ phía sau
  ctx.beginPath();
  ctx.arc(u * 0.14, -u * 0.24, u * 0.16, 0, Math.PI * 2);
  ctx.fill();
  // Khuôn mặt
  ctx.fillStyle = "#f6c9a2";
  ctx.beginPath();
  ctx.arc(u * 0.5, -u * 0.02, u * 0.28, -Math.PI * 0.55, Math.PI * 0.72);
  ctx.fill();

  // Kính lặn tự chế (viền tre + tròng xanh trong)
  ctx.fillStyle = "#7fe2ff";
  ctx.strokeStyle = "#8a5a2b";
  ctx.lineWidth = Math.max(1.5, u * 0.09);
  ctx.beginPath();
  ctx.ellipse(u * 0.64, -u * 0.06, u * 0.16, u * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // Ánh sáng trên tròng kính
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath();
  ctx.arc(u * 0.68, -u * 0.1, u * 0.045, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1];
  const SKY = 8.5;
  const top = 74, bottom = 78;
  const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s;
  const oy = top + SKY * s;
  const sx = (x) => ox + x * s;
  const sy = (d) => oy + d * s;

  // 1. Bầu trời ánh hồng bình minh miền Tây
  const skyGrad = ctx.createLinearGradient(0, 0, 0, oy);
  skyGrad.addColorStop(0, "#4c5c8a");
  skyGrad.addColorStop(0.42, "#d88a7a");
  skyGrad.addColorStop(0.78, "#f7be8c");
  skyGrad.addColorStop(1, "#ffe5b4");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, oy + 2);

  // Mặt trời sớm mọc trên sông
  const sunX = sx(X * 0.78), sunY = oy - SKY * s * 0.42;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, s * 0.4, sunX, sunY, s * 10);
  sunGlow.addColorStop(0, "rgba(255, 245, 200, 0.95)");
  sunGlow.addColorStop(0.28, "rgba(255, 200, 130, 0.55)");
  sunGlow.addColorStop(1, "rgba(255, 160, 110, 0)");
  ctx.fillStyle = sunGlow;
  ctx.beginPath(); ctx.arc(sunX, sunY, s * 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff6cf";
  ctx.beginPath(); ctx.arc(sunX, sunY, s * 2.1, 0, Math.PI * 2); ctx.fill();

  // Mây hồng trôi nhẹ + cánh cò trắng xa xa
  ctx.fillStyle = "rgba(255, 234, 210, 0.42)";
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 280 + animTime * 7) % (w + 180)) - 90;
    const cy = top + 14 + (i % 2) * 18;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 46, 12, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 26, cy - 5, 30, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = "rgba(255, 248, 240, 0.75)";
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) {
    const bx = ((i * 95 + animTime * 16) % (w + 60)) - 30;
    const by = oy - SKY * s * (0.58 + (i % 2) * 0.14) + Math.sin(animTime * 4 + i) * 3;
    const flap = Math.sin(animTime * 7 + i * 2) * 4;
    ctx.beginPath();
    ctx.moveTo(bx - 7, by + flap);
    ctx.quadraticCurveTo(bx - 3, by - 4, bx, by);
    ctx.quadraticCurveTo(bx + 3, by - 4, bx + 7, by + flap);
    ctx.stroke();
  }

  // Bờ đất xa + rặng dừa nước + nhà sàn dọc bờ sông
  ctx.fillStyle = "#3f5e35";
  ctx.beginPath();
  ctx.moveTo(0, oy);
  for (let gx = 0; gx <= w; gx += 40) {
    ctx.lineTo(gx, oy - s * (0.7 + Math.sin(gx * 0.025) * 0.3));
  }
  ctx.lineTo(w, oy);
  ctx.closePath();
  ctx.fill();

  [18, 25, 38, 52, 68, 84, 92].forEach((px, i) => {
    drawNipaPalm(sx(px), oy, s * (2.8 + (i % 3) * 0.65), i * 1.1);
  });
  drawStiltHouse(sx(34), oy, s * 0.85);
  drawStiltHouse(sx(73), oy, s * 0.78);

  // 2. Nước sông Chín Khúc (màu phù sa ấm ở mặt -> xanh rêu sông -> đáy sâu)
  const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
  waterGrad.addColorStop(0, "#7b8c6b");
  waterGrad.addColorStop(0.12, "#51786b");
  waterGrad.addColorStop(0.48, "#295254");
  waterGrad.addColorStop(0.82, "#163138");
  waterGrad.addColorStop(1, "#0d1d24");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(sx(0), oy, X * s, D * s);

  // Ánh nắng bình minh phản chiếu + tia nắng xuyên nước
  ctx.save();
  ctx.beginPath();
  ctx.rect(sx(0), oy, X * s, D * s);
  ctx.clip();
  for (let i = 0; i < 6; i++) {
    const rx = sx(12 + i * 16) + Math.sin(animTime * 0.6 + i) * s * 1.5;
    const rg = ctx.createLinearGradient(rx, oy, rx - s * 4, sy(16));
    rg.addColorStop(0, "rgba(255, 232, 175, 0.14)");
    rg.addColorStop(1, "rgba(255, 232, 175, 0)");
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(rx - s * 2.2, oy);
    ctx.lineTo(rx + s * 2.2, oy);
    ctx.lineTo(rx - s * 1.5, sy(16));
    ctx.lineTo(rx - s * 7.5, sy(16));
    ctx.closePath();
    ctx.fill();
  }

  // Hạt phù sa lơ lửng rất nhẹ trong nước
  ctx.fillStyle = "rgba(225, 200, 150, 0.16)";
  for (let i = 0; i < 36; i++) {
    const fx = sx(((i * 29.3 + animTime * (0.4 + (i % 3) * 0.15)) % X));
    const fd = sy(((i * 7.1 + Math.sin(animTime + i) * 0.4) % (D - 1)) + 0.8);
    ctx.beginPath();
    ctx.arc(fx, fd, 1.3 + (i % 2) * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Rong sông & phù sa đáy sông (d = D)
  ctx.fillStyle = "#1c1812";
  ctx.fillRect(sx(0), sy(D) - s * 0.55, X * s, s * 0.7);
  for (let wx = 4; wx < X; wx += 6.5) {
    const sway = Math.sin(animTime * 2 + wx) * s * 0.4;
    ctx.strokeStyle = wx % 13 < 6 ? "rgba(56, 110, 74, 0.55)" : "rgba(44, 88, 66, 0.45)";
    ctx.lineWidth = Math.max(1.5, s * 0.18);
    ctx.beginPath();
    ctx.moveTo(sx(wx), sy(D));
    ctx.quadraticCurveTo(sx(wx) + sway, sy(D - 1.5), sx(wx) + sway * 1.3, sy(D - 2.6 - (wx % 2)));
    ctx.stroke();
  }

  // Vạch độ sâu tinh tế
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255, 240, 210, 0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(`${d}m`, sx(0) + 6, sy(d) - 3, { size: 10, color: "rgba(255,240,210,0.42)" });
  }
  ctx.restore();

  // Viền bể nước & mặt nước gợn sóng
  ctx.strokeStyle = "rgba(255, 240, 200, 0.25)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sx(0), oy, X * s, D * s);

  ctx.strokeStyle = "rgba(255, 244, 214, 0.85)";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let x = 0; x <= X; x += 1) {
    const wy = oy + Math.sin(x * 0.45 + animTime * 3.2) * 1.8;
    if (x === 0) ctx.moveTo(sx(x), wy); else ctx.lineTo(sx(x), wy);
  }
  ctx.stroke();

  // 3. Bến đò & Nhà bè Má Tư tại dock_pos
  const dp = meta.dock_pos || [2, 0];
  const dr = meta.dock_radius || 3;
  const dpx = sx(dp[0]), dpy = sy(dp[1]);
  // Vùng cập bến
  ctx.save();
  ctx.fillStyle = "rgba(255, 224, 130, 0.08)";
  ctx.beginPath(); ctx.arc(dpx, dpy, dr * s, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = "rgba(255, 224, 130, 0.72)";
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.arc(dpx, dpy, dr * s, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  // Cầu tàu + mái lá + xuồng ba lá
  ctx.fillStyle = "#6b4423";
  ctx.fillRect(sx(dp[0] - 2.1), oy - s * 0.7, 4.2 * s, s * 0.55);
  ctx.fillStyle = "#523218";
  ctx.fillRect(sx(dp[0] - 1.8), oy - s * 0.15, 0.4 * s, s * 1.5);
  ctx.fillRect(sx(dp[0] + 1.4), oy - s * 0.15, 0.4 * s, s * 1.5);
  // Mái lá bến
  ctx.fillStyle = "#9c472e";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 2.4), oy - s * 2.4);
  ctx.lineTo(sx(dp[0]), oy - s * 4.0);
  ctx.lineTo(sx(dp[0] + 2.4), oy - s * 2.4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#4d2712";
  ctx.lineWidth = Math.max(1.5, s * 0.18);
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 1.6), oy - s * 2.4); ctx.lineTo(sx(dp[0] - 1.6), oy - s * 0.7);
  ctx.moveTo(sx(dp[0] + 1.6), oy - s * 2.4); ctx.lineTo(sx(dp[0] + 1.6), oy - s * 0.7);
  ctx.stroke();
  // Đèn lồng nhỏ dưới mái bến
  ctx.fillStyle = "#ffca45";
  ctx.beginPath(); ctx.arc(sx(dp[0] + 1.1), oy - s * 1.9, Math.max(3, s * 0.25), 0, Math.PI * 2); ctx.fill();
  // Xuồng ba lá dập dềnh cạnh bến
  const bob = Math.sin(animTime * 2.5) * 1.6;
  ctx.fillStyle = "#7a4d28";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] + 2.2), oy - s * 0.25 + bob);
  ctx.quadraticCurveTo(sx(dp[0] + 3.8), oy + s * 0.5 + bob, sx(dp[0] + 5.5), oy - s * 0.3 + bob);
  ctx.lineTo(sx(dp[0] + 4.9), oy - s * 0.05 + bob);
  ctx.quadraticCurveTo(sx(dp[0] + 3.8), oy + s * 0.2 + bob, sx(dp[0] + 2.7), oy - s * 0.05 + bob);
  ctx.closePath();
  ctx.fill();
  text("BẾN MÁ TƯ (E)", dpx, oy - s * 4.3, { size: 11, align: "center", bold: true, color: "#fff5d6", shadow: true });

  // Xác định mục tiêu tương tác gần nhất để highlight
  const p = snap.player;
  let promptText = null;
  let highlightNodeId = null;
  let highlightFishId = null;
  if (p && p.pos) {
    const atSurf = p.at_surface !== undefined ? p.at_surface : p.pos[1] <= (meta.surface_depth || 0.5);
    if (dist2(p.pos, dp) <= dr) {
      promptText = "[E] Cập bến giao hàng";
    } else if (atSurf) {
      const ir = meta.interact_radius || 2.0;
      const readyNodes = (snap.nodes || []).filter((n) => n.ready !== false && dist2(p.pos, n.pos) <= ir);
      readyNodes.sort((a, b) => (dist2(p.pos, a.pos) - dist2(p.pos, b.pos)) || cmpId(a.id, b.id));
      if (readyNodes.length) {
        highlightNodeId = readyNodes[0].id;
        promptText = `[E] Hái ${kindName(readyNodes[0].kind)}`;
      }
    } else {
      const cr = meta.catch_radius || 2.0;
      const inRange = (snap.fish || []).filter((f) => dist2(p.pos, f.pos) <= cr);
      inRange.sort((a, b) => (dist2(p.pos, a.pos) - dist2(p.pos, b.pos)) || cmpId(a.id, b.id));
      if (inRange.length) {
        highlightFishId = inRange[0].id;
        promptText = (p.catch_cd_ticks || 0) > 0
          ? `Đang hồi chiêu (${(p.catch_cd_ticks / 60).toFixed(1)}s)`
          : `[Space] Bắt ${kindName(inRange[0].kind)}`;
      }
    }
  }

  // 4. Nút hái trên mặt nước (bông điên điển / bông súng)
  (snap.nodes || []).forEach((n) => {
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    const ready = n.ready !== false;
    const isHi = n.id === highlightNodeId;
    const bobN = Math.sin(animTime * 2.4 + n.pos[0]) * 1.5;

    ctx.save();
    ctx.translate(nx, ny + bobN);
    if (isHi) {
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -s * 0.2, s * 1.35 + Math.sin(animTime * 6) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = ready ? 1 : 0.35;
    if (n.kind === "bong_dien_dien") {
      // Cành điên điển rủ xuống mặt nước với chùm hoa vàng rực
      ctx.strokeStyle = "#2f6b32";
      ctx.lineWidth = Math.max(1.8, s * 0.16);
      ctx.beginPath(); ctx.moveTo(-s * 0.8, -s * 1.3); ctx.quadraticCurveTo(0, -s * 0.7, s * 0.7, -s * 0.2); ctx.stroke();
      ctx.fillStyle = "#3e873c";
      ctx.beginPath(); ctx.ellipse(-s * 0.3, -s * 0.85, s * 0.55, s * 0.24, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 0.45, -s * 0.5, s * 0.5, s * 0.22, 0.3, 0, Math.PI * 2); ctx.fill();
      [[-0.4, -0.45], [0.0, -0.58], [0.35, -0.25], [-0.1, -0.2], [0.55, -0.1]].forEach(([bx, by]) => {
        ctx.fillStyle = "#ffd633";
        ctx.beginPath(); ctx.arc(bx * s, by * s, s * 0.26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#e09100";
        ctx.beginPath(); ctx.arc(bx * s, by * s, s * 0.09, 0, Math.PI * 2); ctx.fill();
      });
    } else {
      // Bông súng tím hồng nổi trên lá súng xanh
      ctx.fillStyle = "#367a42";
      ctx.beginPath(); ctx.ellipse(-s * 0.45, s * 0.05, s * 0.65, s * 0.24, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 0.55, s * 0.08, s * 0.55, s * 0.22, 0, 0, Math.PI * 2); ctx.fill();
      // Cọng súng dưới mặt nước
      ctx.strokeStyle = "rgba(180, 95, 120, 0.65)";
      ctx.lineWidth = Math.max(1.5, s * 0.12);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-s * 0.2, s * 0.9, s * 0.15, s * 1.8); ctx.stroke();
      // Cánh hoa hồng
      for (let i = -2; i <= 2; i++) {
        ctx.save();
        ctx.translate(0, -s * 0.1);
        ctx.rotate(i * 0.3);
        ctx.fillStyle = i % 2 === 0 ? "#ff8cb5" : "#e35488";
        ctx.beginPath(); ctx.ellipse(0, -s * 0.36, s * 0.22, s * 0.46, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = "#ffe066";
      ctx.beginPath(); ctx.arc(0, -s * 0.2, s * 0.18, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    text(n.id, 0, -s * 1.45, { size: 10, align: "center", bold: true, color: "#2b1d12" });
    if (!ready && n.regrow_ticks) {
      const regrowMax = (meta.regrow_s || 20) * 60;
      const pct = 1 - n.regrow_ticks / regrowMax;
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, s * 1.2, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#80f0a8";
      ctx.beginPath(); ctx.arc(0, s * 1.2, 10, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2); ctx.stroke();
      text(Math.ceil(n.regrow_ticks / 60) + "s", 0, s * 1.2 + 3.5, { size: 9, align: "center", bold: true });
    }
    ctx.restore();
  });

  // 5. Đàn cá dưới nước (cá linh theo bầy 3 con, cá lóc lớn có vằn)
  (snap.fish || []).forEach((f, idx) => {
    const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
    const isHi = f.id === highlightFishId;
    const wag = Math.sin(animTime * 7 + idx * 1.7) * 0.22;
    const bobF = Math.sin(animTime * 2.5 + idx) * 2.2;

    ctx.save();
    ctx.translate(fx, fy + bobF);
    if (isHi) {
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, s * 1.45 + Math.sin(animTime * 7) * 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);

    if (f.kind === "ca_linh") {
      // Đàn 3 con cá linh ánh bạc lấp lánh
      [[-0.35, -0.32, 0.72], [0.25, 0.0, 0.85], [-0.25, 0.35, 0.7]].forEach(([oxf, oyf, sc]) => {
        ctx.save();
        ctx.translate(oxf * s, oyf * s);
        const fs = s * sc;
        ctx.fillStyle = "#d9eef8";
        ctx.beginPath(); ctx.ellipse(0, 0, fs * 0.72, fs * 0.3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#91bed6";
        ctx.beginPath(); ctx.ellipse(0, -fs * 0.1, fs * 0.62, fs * 0.12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#7ca9c2";
        ctx.beginPath(); ctx.moveTo(-fs * 0.58, 0); ctx.lineTo(-fs * 1.05, (-0.34 + wag) * fs); ctx.lineTo(-fs * 1.05, (0.34 + wag) * fs); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#182430";
        ctx.beginPath(); ctx.arc(fs * 0.42, -fs * 0.05, Math.max(1.2, fs * 0.09), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
    } else {
      // Cá lóc đồng to, vằn sọc rằn ri
      ctx.fillStyle = "#5f7a42";
      ctx.beginPath(); ctx.ellipse(0, 0, s * 1.15, s * 0.48, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#a2b57f";
      ctx.beginPath(); ctx.ellipse(s * 0.08, s * 0.18, s * 0.88, s * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      // Sọc vằn cá lóc
      ctx.strokeStyle = "#2b3d1b";
      ctx.lineWidth = Math.max(1.5, s * 0.14);
      [-0.45, -0.1, 0.25, 0.55].forEach((bx) => {
        ctx.beginPath(); ctx.moveTo(bx * s, -s * 0.34); ctx.lineTo((bx - 0.12) * s, s * 0.15); ctx.stroke();
      });
      // Đuôi & vây lưng
      ctx.fillStyle = "#48612f";
      ctx.beginPath(); ctx.moveTo(-s * 0.95, 0); ctx.lineTo(-s * 1.55, (-0.42 + wag) * s); ctx.lineTo(-s * 1.55, (0.42 + wag) * s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffe082";
      ctx.beginPath(); ctx.arc(s * 0.78, -s * 0.1, Math.max(1.8, s * 0.11), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#111";
      ctx.beginPath(); ctx.arc(s * 0.8, -s * 0.1, Math.max(1, s * 0.055), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    text(`${f.id} · ${kindName(f.kind)}`, fx, fy - s * 0.85 + bobF, { size: 10, align: "center", color: "rgba(255,248,230,0.85)", shadow: true });
  });

  // 6. Nhân vật Út Sen + vòng tầm tương tác + bong bóng khí
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > (meta.surface_depth || 0.5) : !p.at_surface;

    // Sinh bọt khí nhẹ khi đang lặn
    if (underwater && Math.random() < 0.14 && !snap.finished) {
      spawnParticles(p.pos[0], p.pos[1] - 0.3, 1, {
        color: "rgba(220, 248, 255, 0.6)",
        angle: -Math.PI / 2,
        spread: 0.4,
        speed: 1.6,
        life: 1.0,
        radius: 2.3,
        kind: "bubble",
      });
    }

    // Vòng bán kính tương tác / bắt cá
    if (underwater && meta.catch_radius) {
      ctx.strokeStyle = highlightFishId ? "rgba(255, 224, 102, 0.55)" : "rgba(200, 240, 255, 0.22)";
      ctx.lineWidth = 1.3;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    } else if (!underwater && meta.interact_radius) {
      ctx.strokeStyle = highlightNodeId ? "rgba(255, 224, 102, 0.65)" : "rgba(255, 245, 210, 0.28)";
      ctx.lineWidth = 1.3;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Nhấp nháy khi invuln_ticks > 0
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      drawUtSenGather(px, py, s, p, snap.hold);
    }

    // Vòng cảnh báo tiến độ ngạt (zero_oxy_ticks) ngay quanh Út Sen
    if (p.zero_oxy_ticks > 0) {
      const chokeMax = meta.choke_interval_ticks || 60;
      const frac = p.zero_oxy_ticks / chokeMax;
      ctx.strokeStyle = "rgba(255, 70, 70, 0.9)";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(18, s * 1.15), -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.stroke();
      text("NGẠT!", px, py - Math.max(22, s * 1.45), { size: 11, align: "center", bold: true, color: "#ff6b6b", shadow: true });
    }

    // Gợi ý phím tương tác theo ngữ cảnh
    if (promptText && !snap.finished) {
      const tw = Math.max(120, promptText.length * 7.2 + 20);
      panel(px - tw / 2, py - Math.max(38, s * 2.1) - 18, tw, 24, 12, "rgba(26, 16, 9, 0.88)", "#ffd46b");
      text(promptText, px, py - Math.max(38, s * 2.1) - 5, { size: 11, align: "center", base: "middle", bold: true, color: "#ffe58f" });
    }
  }

  // Hiệu ứng hạt & chữ bay trong không gian thế giới
  drawWorldEffects(sx, sy);

  // Cảnh báo viền đỏ khi oxy sắp cạn hoặc đang ngạt
  if (p && p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25 && !snap.finished) {
    const pulse = 0.22 + 0.16 * Math.sin(animTime * 8);
    const vig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.65);
    vig.addColorStop(0, "rgba(255, 40, 40, 0)");
    vig.addColorStop(1, `rgba(220, 30, 30, ${pulse})`);
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);
  }

  // 7. HUD BUỔI SÁNG (GATHER) — Đầy đủ trường PRD-0
  panel(10, 8, Math.min(w - 300, 620), 58, 12);
  text("☀ BUỔI SÁNG · SÔNG CHÍN KHÚC", 24, 24, { size: 11, bold: true, color: "#ffd46b" });
  text("⏱ " + fmtTime(snap.time_left_ticks), 24, 51, { size: 22, bold: true });

  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const oxyRatio = p.oxygen_ticks / p.oxygen_max_ticks;
    const oxyColor = oxyRatio < 0.25 ? "#ff5252" : oxyRatio < 0.5 ? "#ffb74d" : "#4fd3ff";
    progressBar(120, 29, 195, 22, oxyRatio, oxyColor, `Oxy ${Math.ceil(p.oxygen_ticks / 60)}s / ${Math.round(p.oxygen_max_ticks / 60)}s`);
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hearts = "";
    for (let i = 0; i < p.hp_max; i++) hearts += i < p.hp ? "♥ " : "♡ ";
    text(hearts.trim(), 332, 48, { size: 22, color: "#ff6b81", shadow: true });
  }
  if (p && p.pos) {
    const depthTxt = p.pos[1] <= (meta.surface_depth || 0.5) ? "Mặt nước" : `Độ sâu ${p.pos[1].toFixed(1)}m`;
    text(depthTxt, 435, 36, { size: 12, bold: true, color: "#cde8f5" });
    const cdTxt = (p.catch_cd_ticks || 0) > 0 ? `Hồi bắt: ${(p.catch_cd_ticks / 60).toFixed(1)}s` : "Bắt cá: Sẵn sàng";
    text(cdTxt, 435, 53, { size: 11, color: (p.catch_cd_ticks || 0) > 0 ? "#ffab73" : "#9be8b8" });
  }

  // Thanh giỏ lưới (LIFO) ở cạnh dưới
  panel(10, h - bottom + 6, w - 20, bottom - 14, 12);
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity;
    const slotSz = Math.min(34, Math.max(20, (w - 380) / cap - 5));
    const y0 = h - bottom + 14;
    for (let i = 0; i < cap; i++) {
      const x0 = 24 + i * (slotSz + 5);
      roundRectPath(x0, y0, slotSz, slotSz, 7);
      ctx.fillStyle = snap.hold[i] ? "rgba(255, 240, 210, 0.14)" : "rgba(0, 0, 0, 0.3)";
      ctx.fill();
      ctx.strokeStyle = snap.hold[i] ? "rgba(255, 212, 107, 0.65)" : "rgba(255, 255, 255, 0.14)";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (snap.hold[i]) {
        drawIngredientIcon(x0 + slotSz / 2, y0 + slotSz / 2, slotSz * 0.42, snap.hold[i]);
      }
    }
    const counts = {};
    snap.hold.forEach((k) => { counts[k] = (counts[k] || 0) + 1; });
    const summary = Object.keys(counts).map((k) => `${kindName(k)} ×${counts[k]}`).join("  ·  ");
    text(`Giỏ lưới (${snap.hold.length}/${cap}): ${summary || "Còn trống — lặn bắt cá hoặc hái bông nhé!"}`, 24, y0 + slotSz + 16, {
      size: 12,
      color: snap.hold.length >= cap ? "#ffab73" : "#f5e6cc",
      bold: snap.hold.length >= cap,
    });
  }
  text("WASD/Mũi tên: Bơi  ·  E: Hái / Cập bến  ·  Space: Bắt cá  ·  R: Chơi lại", w - 24, h - 18, {
    size: 11.5,
    align: "right",
    color: "#d6c3a5",
  });
}

// ============================================================================
// CẢNH 2: BUỔI TỐI (QUAN) — NHÀ BÈ QUÁN ĂN CHỢ NỔI ĐÈN DÂY VÀNG
// ============================================================================
function drawUtSenQuan(px, py, s, handDishId) {
  ctx.save();
  ctx.translate(px, py);
  const r = Math.max(12, s * 0.46);

  // Bóng đổ trên sàn gỗ
  ctx.fillStyle = "rgba(0, 0, 0, 0.32)";
  ctx.beginPath(); ctx.ellipse(0, r * 0.25, r * 1.05, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();

  ctx.rotate(lastQuanFacing);

  // Nếu đang bưng món trên tay -> mâm tre phía trước
  if (handDishId) {
    ctx.fillStyle = "#c99751";
    ctx.beginPath(); ctx.arc(r * 1.15, 0, r * 0.72, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#6e471b";
    ctx.lineWidth = 1.6;
    ctx.stroke();
    drawDishIcon(r * 1.15, 0, r * 0.56, handDishId);
  }

  // Hai vai áo bà ba màu nâu hồng ấm
  ctx.fillStyle = "#c95b42";
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.75, r * 0.96, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#7a3020";
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // Khăn rằn Nam Bộ quàng quanh vai
  ctx.strokeStyle = "#f2f2f2";
  ctx.lineWidth = r * 0.24;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, -Math.PI * 0.65, Math.PI * 0.65); ctx.stroke();
  ctx.strokeStyle = "#1f1f1f";
  ctx.setLineDash([3, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Đầu + tóc đen búi gọn
  ctx.fillStyle = "#1d1614";
  ctx.beginPath(); ctx.arc(r * 0.06, 0, r * 0.52, 0, Math.PI * 2); ctx.fill();
  // Búi tóc nhỏ phía sau đầu
  ctx.beginPath(); ctx.arc(-r * 0.46, 0, r * 0.24, 0, Math.PI * 2); ctx.fill();
  // Kẹp tóc nhỏ xinh màu vàng
  ctx.fillStyle = "#ffd46b";
  ctx.beginPath(); ctx.arc(-r * 0.34, -r * 0.12, r * 0.09, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawCustomer(cx, cy, s, c) {
  const idNum = parseInt(String(c.id || "1").replace(/\D/g, ""), 10) || 1;
  const shirtPalette = ["#4b7f8c", "#7c659c", "#5a8f5e", "#b5695b", "#4e6e9c", "#9c7b48"];
  const shirt = shirtPalette[idNum % shirtPalette.length];
  const r = Math.max(12, s * 0.44);
  const patMax = ((snap.meta && snap.meta.patience_s) || 60) * 60;
  const lowPat = c.state !== "eating" && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) < 0.22;
  const jitter = lowPat ? Math.sin(animTime * 28) * 1.8 : 0;

  ctx.save();
  ctx.translate(cx + jitter, cy);

  // Bóng
  ctx.fillStyle = "rgba(0,0,0,0.32)";
  ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 1.0, r * 0.78, 0, 0, Math.PI * 2); ctx.fill();

  // Vai áo khách
  ctx.fillStyle = shirt;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.96, r * 0.68, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Đầu khách
  ctx.fillStyle = "#261c17";
  ctx.beginPath(); ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2); ctx.fill();
  // Chiếc nón lá nhỏ đội lệch hoặc đặt bên vai cho một số khách
  if (idNum % 2 === 1) {
    ctx.fillStyle = "#e8cf90";
    ctx.beginPath(); ctx.arc(r * 0.55, -r * 0.25, r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#a68542";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function drawStringLights(x1, y1, x2, y2, count) {
  // Dây đen uốn nhẹ
  ctx.strokeStyle = "rgba(30, 20, 14, 0.75)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + 12, x2, y2);
  ctx.stroke();

  for (let i = 1; i < count; i++) {
    const t = i / count;
    const lx = x1 + (x2 - x1) * t;
    const ly = y1 + (y2 - y1) * t + 4 * t * (1 - t) * 12;
    const glow = 0.72 + 0.28 * Math.sin(animTime * 2.6 + i * 0.9);
    const rad = ctx.createRadialGradient(lx, ly, 1, lx, ly, 16);
    rad.addColorStop(0, `rgba(255, 224, 115, ${0.75 * glow})`);
    rad.addColorStop(1, "rgba(255, 190, 70, 0)");
    ctx.fillStyle = rad;
    ctx.beginPath(); ctx.arc(lx, ly, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff4bd";
    ctx.beginPath(); ctx.arc(lx, ly, 3.2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  const top = 76, bottom = 112;
  const s = Math.max(1, Math.min((w - 56) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2;
  const oy = top + (h - top - bottom - s * Z) / 2;
  const sx = (x) => ox + x * s;
  const sy = (z) => oy + (Z - z) * s;

  // 1. Sông nước về đêm quanh nhà bè
  const nightGrad = ctx.createLinearGradient(0, 0, 0, h);
  nightGrad.addColorStop(0, "#09131c");
  nightGrad.addColorStop(0.5, "#102432");
  nightGrad.addColorStop(1, "#0a1721");
  ctx.fillStyle = nightGrad;
  ctx.fillRect(0, 0, w, h);

  // Gợn sóng & ánh đèn vàng phản chiếu trên mặt sông đêm
  for (let i = 0; i < 28; i++) {
    const rx = ((i * 97 + animTime * 12) % (w + 80)) - 40;
    const ry = ((i * 53) % h);
    ctx.strokeStyle = i % 3 === 0 ? "rgba(255, 210, 120, 0.14)" : "rgba(130, 190, 220, 0.1)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + 26 + (i % 3) * 10, ry);
    ctx.stroke();
  }

  // Xuồng ba lá cột cạnh nhà bè bên phải
  const boatX = sx(X) + 18, boatY = sy(Z * 0.45) + Math.sin(animTime * 2.2) * 3;
  ctx.save();
  ctx.translate(boatX, boatY);
  ctx.fillStyle = "#5c391e";
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 36, 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#422713";
  ctx.beginPath(); ctx.ellipse(0, 0, 7, 26, 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#8a5a32";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(6, -8); ctx.moveTo(-6, 8); ctx.lineTo(6, 8); ctx.stroke();
  ctx.restore();

  // 2. Sàn nhà bè gỗ miền Tây
  const raftX = sx(0), raftY = sy(Z), raftW = X * s, raftH = Z * s;
  // Bóng nhà bè trên nước
  ctx.fillStyle = "rgba(0, 0, 0, 0.48)";
  roundRectPath(raftX + 8, raftY + 10, raftW, raftH, 10);
  ctx.fill();

  // Mặt sàn gỗ ấm áp
  const floorGrad = ctx.createLinearGradient(raftX, raftY, raftX, raftY + raftH);
  floorGrad.addColorStop(0, "#b8844c");
  floorGrad.addColorStop(0.5, "#a6733f");
  floorGrad.addColorStop(1, "#8f5f31");
  roundRectPath(raftX, raftY, raftW, raftH, 8);
  ctx.fillStyle = floorGrad;
  ctx.fill();

  // Vẽ các tấm ván gỗ ngang
  ctx.save();
  roundRectPath(raftX, raftY, raftW, raftH, 8);
  ctx.clip();
  const plankH = Math.max(14, s * 0.65);
  ctx.strokeStyle = "rgba(62, 34, 14, 0.28)";
  ctx.lineWidth = 1;
  for (let py = raftY + plankH; py < raftY + raftH; py += plankH) {
    ctx.beginPath(); ctx.moveTo(raftX, py); ctx.lineTo(raftX + raftW, py); ctx.stroke();
  }
  // Khu vực bếp có nền gạch/đá sẫm nhẹ
  ctx.fillStyle = "rgba(50, 32, 20, 0.22)";
  roundRectPath(raftX + s * 0.4, raftY + s * 0.4, s * 4.2, s * 3.6, 8);
  ctx.fill();
  text("KHU BẾP", raftX + s * 2.5, raftY + s * 0.9, { size: 10, align: "center", bold: true, color: "rgba(255,236,195,0.5)" });

  // Chiếu cói trang trí dưới khu bàn ăn
  ctx.fillStyle = "rgba(235, 205, 138, 0.16)";
  roundRectPath(sx(6.2), sy(4.2), s * 5.6, s * 3.8, 10);
  ctx.fill();
  ctx.restore();

  // Lan can tre quanh nhà bè
  roundRectPath(raftX, raftY, raftW, raftH, 8);
  ctx.strokeStyle = "#593518";
  ctx.lineWidth = 6;
  ctx.stroke();
  roundRectPath(raftX, raftY, raftW, raftH, 8);
  ctx.strokeStyle = "#d9a962";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Bảng hiệu nhỏ của quán
  panel(raftX + raftW / 2 - 115, raftY - 14, 230, 22, 10, "#4a2813", "#ffd46b");
  text("🏮 QUÁN MÁ TƯ · CHỢ NỔI RẠCH SEN", raftX + raftW / 2, raftY - 3, { size: 11, align: "center", base: "middle", bold: true, color: "#ffe599" });

  // Xác định đối tượng tương tác được chọn theo đúng luật PRD: (khoảng cách, bếp trước bàn, id)
  const p = snap.player;
  const byTable = {};
  (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });
  const hasReservedOrder = (snap.customers || []).some((c) => c.state === "waiting" && c.order_status === "reserved");
  const handDishId = dishIdOf(snap.hand);
  const handOrderId = snap.hand && typeof snap.hand === "object" ? snap.hand.order_id : null;

  let selectedTarget = null;
  let quanPrompt = null;
  if (p && p.pos) {
    const ir = meta.interact_radius || 1.5;
    const candidates = [];
    (snap.stoves || []).forEach((st) => {
      const d = dist2(p.pos, st.pos);
      if (d <= ir) candidates.push({ kind: "stove", d, prio: 0, id: st.id, obj: st });
    });
    (snap.tables || []).forEach((tb) => {
      const d = dist2(p.pos, tb.pos);
      if (d <= ir) candidates.push({ kind: "table", d, prio: 1, id: tb.id, obj: tb });
    });
    candidates.sort((a, b) => (a.d - b.d) || (a.prio - b.prio) || cmpId(a.id, b.id));
    if (candidates.length) {
      selectedTarget = candidates[0];
      if (selectedTarget.kind === "stove") {
        const st = selectedTarget.obj;
        if (st.state === "idle" && hasReservedOrder) quanPrompt = `[E] Nấu đơn tại bếp ${st.id}`;
        else if (st.state === "ready" && !snap.hand) quanPrompt = `[E] Bưng ${dishName(dishIdOf(st.dish), true)}`;
        else if (st.state === "ready" && snap.hand) quanPrompt = "Tay đang bận bưng món!";
      } else {
        const tb = selectedTarget.obj;
        const cust = byTable[tb.id];
        if (cust && cust.state === "waiting" && snap.hand && (!handOrderId || handOrderId === cust.id)) {
          quanPrompt = `[E] Phục vụ bàn ${tb.id}`;
        }
      }
    }
  }

  // 3. Vẽ Bếp (stoves) — bếp lò đất + khói bếp khi nấu
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const isSel = selectedTarget && selectedTarget.kind === "stove" && selectedTarget.id === st.id;
    const stDishId = dishIdOf(st.dish);

    // Sinh khói bếp bay lên khi cooking hoặc hương thơm khi ready (trong quan: +z là hướng lên)
    if (st.state === "cooking" && Math.random() < 0.22 && !snap.finished) {
      spawnParticles(st.pos[0], st.pos[1] + 0.3, 1, {
        color: "rgba(235, 228, 215, 0.45)",
        angle: Math.PI / 2,
        spread: 0.7,
        speed: 0.9,
        life: 1.1,
        radius: 6,
        kind: "smoke",
      });
    } else if (st.state === "ready" && Math.random() < 0.14 && !snap.finished) {
      spawnParticles(st.pos[0], st.pos[1] + 0.2, 1, {
        color: "rgba(255, 232, 140, 0.5)",
        angle: Math.PI / 2,
        spread: 0.9,
        speed: 0.7,
        life: 0.9,
        radius: 4.5,
        kind: "smoke",
      });
    }

    ctx.save();
    ctx.translate(bx, by);
    if (isSel) {
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 2.5;
      roundRectPath(-s * 0.95, -s * 0.95, s * 1.9, s * 1.9, 12);
      ctx.stroke();
    }

    // Thân quầy bếp
    roundRectPath(-s * 0.82, -s * 0.82, s * 1.64, s * 1.64, 10);
    ctx.fillStyle = st.state === "cooking" ? "#6b3822" : st.state === "ready" ? "#3b6b3e" : "#4f4640";
    ctx.fill();
    ctx.strokeStyle = st.state === "ready" ? "#8bf59a" : st.state === "cooking" ? "#ffad42" : "#8f7e6e";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Lò than tròn ở giữa
    ctx.fillStyle = "#2b2420";
    ctx.beginPath(); ctx.arc(0, 0, s * 0.56, 0, Math.PI * 2); ctx.fill();
    if (st.state === "cooking") {
      // Lửa than bập bùng
      const glow = 0.75 + 0.25 * Math.sin(animTime * 18);
      ctx.fillStyle = `rgba(255, 120, 30, ${glow})`;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.48, 0, Math.PI * 2); ctx.fill();
      drawDishIcon(0, 0, s * 0.36, stDishId);
    } else if (st.state === "ready") {
      ctx.fillStyle = "rgba(130, 245, 145, 0.25)";
      ctx.beginPath(); ctx.arc(0, 0, s * 0.52, 0, Math.PI * 2); ctx.fill();
      drawDishIcon(0, 0, s * 0.44, stDishId);
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.32, 0, Math.PI * 2); ctx.stroke();
    }

    // Nhãn bếp & trạng thái
    text(st.id, -s * 0.65, -s * 0.52, { size: 10, bold: true, color: "#ffe5b4" });
    if (st.state === "cooking") {
      const info = DISH_INFO[stDishId];
      const totalCook = ((info && info.cook_s) || 6) * 60;
      const frac = st.cook_ticks_left !== undefined ? 1 - st.cook_ticks_left / totalCook : 0.5;
      progressBar(-s * 0.8, s * 0.92, s * 1.6, 13, frac, "#ff9f38", `${Math.ceil((st.cook_ticks_left || 0) / 60)}s`, { fontSize: 10 });
      text(dishName(stDishId, true), 0, -s * 1.0, { size: 11, align: "center", bold: true, color: "#ffe0a3", shadow: true });
    } else if (st.state === "ready") {
      text("CHÍN RỒI!", 0, s * 1.15, { size: 11, align: "center", bold: true, color: "#8bf59a", shadow: true });
      text(dishName(stDishId, true), 0, -s * 1.0, { size: 11, align: "center", bold: true, color: "#b6ffbe", shadow: true });
    } else {
      text(hasReservedOrder ? "Trống · Bấm E nấu" : "Bếp trống", 0, s * 1.12, { size: 10, align: "center", color: hasReservedOrder ? "#ffd46b" : "#d6c3a5", shadow: true });
    }
    ctx.restore();
  });

  // 4. Vẽ Bàn ăn & Khách (tables + customers)
  const patMax = (meta.patience_s || 60) * 60;
  const eatMax = (meta.eat_s || 10) * 60;
  const tipRatio = meta.tip_min_patience_ratio || 0.5;

  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const isSel = selectedTarget && selectedTarget.kind === "table" && selectedTarget.id === tb.id;
    const c = byTable[tb.id];

    ctx.save();
    ctx.translate(tx, ty);
    if (isSel) {
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, s * 1.08, 0, Math.PI * 2); ctx.stroke();
    }

    // Ghế đẩu gỗ đặt hai bên bàn
    ctx.fillStyle = "#6e4320";
    ctx.beginPath(); ctx.arc(-s * 0.95, s * 0.2, s * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.95, s * 0.2, s * 0.25, 0, Math.PI * 2); ctx.fill();

    // Mặt bàn tròn gỗ
    ctx.fillStyle = "#7a4921";
    ctx.beginPath(); ctx.arc(0, 0, s * 0.92, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#c99457";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Chén nước mắm ớt / đĩa món nếu khách đang ăn
    if (c && c.state === "eating") {
      drawDishIcon(0, -s * 0.12, s * 0.42, c.dish_id);
      text(tb.id, 0, s * 0.62, { size: 10, align: "center", bold: true, color: "#ffe5b4" });
    } else {
      ctx.fillStyle = "#f2e6cf";
      ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.15, s * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#d9532f";
      ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.15, s * 0.08, 0, Math.PI * 2); ctx.fill();
      text(tb.id, 0, 5, { size: 12, align: "center", bold: true, color: "#fff5e1", shadow: true });
    }
    ctx.restore();

    // Vẽ Khách ngồi phía trên bàn
    if (c) {
      const cx = tx, cy = ty - s * 1.45;
      drawCustomer(cx, cy, s, c);

      // Bong bóng gọi món / trạng thái khách
      const label = dishName(c.dish_id, true);
      const statusMap = {
        reserved: "Chờ nấu",
        assigned: "Đang làm",
        unfulfillable: "Hết NL",
        served: "Đang ăn",
      };
      const stLabel = c.state === "eating" ? "Đang ăn ngon!" : (statusMap[c.order_status] || "Đang chờ");
      const bw = Math.max(122, label.length * 7 + 40);
      const bx0 = cx - bw / 2, by0 = cy - s * 1.35 - 32;
      panel(bx0, by0, bw, 42, 10, "rgba(28, 17, 10, 0.9)", c.state === "eating" ? "#7ef5a2" : "#ffd46b");
      drawDishIcon(bx0 + 18, by0 + 21, 13, c.dish_id);
      text(label, bx0 + 36, by0 + 17, { size: 11, bold: true, color: "#fff5e1" });
      text(`${c.id} · ${stLabel}`, bx0 + 36, by0 + 32, {
        size: 10,
        color: c.state === "eating" ? "#8bf59a" : c.order_status === "assigned" ? "#80d8ff" : "#ffd46b",
      });

      // Thanh Kiên nhẫn (có vạch boa 50%) hoặc Thanh Đang ăn
      if (c.state === "eating" && c.eat_ticks_left !== undefined) {
        const ef = 1 - c.eat_ticks_left / eatMax;
        progressBar(cx - s * 0.95, cy + s * 0.56, s * 1.9, 11, ef, "#5cd685", `Ăn ${Math.ceil(c.eat_ticks_left / 60)}s`, { fontSize: 9 });
      } else if (c.patience_ticks_left !== undefined) {
        const pf = c.patience_ticks_left / patMax;
        const pCol = pf >= tipRatio ? "#ffd452" : pf >= 0.25 ? "#ff9838" : "#ff5252";
        progressBar(cx - s * 0.95, cy + s * 0.56, s * 1.9, 11, pf, pCol, `${Math.ceil(c.patience_ticks_left / 60)}s`, {
          fontSize: 9,
          marker: tipRatio,
        });
      }
    }
  });

  // 5. Út Sen (góc nhìn từ trên xuống)
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (lastQuanPos) {
      const dx = p.pos[0] - lastQuanPos[0];
      const dz = p.pos[1] - lastQuanPos[1];
      if (Math.hypot(dx, dz) > 0.002) {
        lastQuanFacing = Math.atan2(-dz, dx); // z tăng lên trên -> y canvas giảm
      }
    }
    lastQuanPos = [p.pos[0], p.pos[1]];

    if (meta.interact_radius) {
      ctx.strokeStyle = selectedTarget ? "rgba(255, 224, 102, 0.65)" : "rgba(255, 240, 210, 0.3)";
      ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    drawUtSenQuan(px, py, s, handDishId);

    if (handDishId) {
      text(`Bưng: ${dishName(handDishId, true)}`, px, py - s * 0.85, { size: 11, align: "center", bold: true, color: "#ffe58f", shadow: true });
    }
    if (quanPrompt && !snap.finished) {
      const tw = Math.max(124, quanPrompt.length * 7.2 + 20);
      panel(px - tw / 2, py + s * 0.72, tw, 24, 12, "rgba(26, 16, 9, 0.9)", "#ffd46b");
      text(quanPrompt, px, py + s * 0.72 + 12, { size: 11, align: "center", base: "middle", bold: true, color: "#ffe58f" });
    }
  }

  // 6. Dây đèn vàng trang trí dọc mái nhà bè
  drawStringLights(raftX + 8, raftY + 6, raftX + raftW - 8, raftY + 6, 11);
  drawStringLights(raftX + 8, raftY + raftH - 6, raftX + raftW - 8, raftY + raftH - 6, 11);

  // Hiệu ứng khói bếp & chữ bay
  drawWorldEffects(sx, sy);

  // 7. HUD BUỔI TỐI (QUÁN) — Đầy đủ trường PRD-0 (gồm Kho khả dụng!)
  panel(10, 8, Math.min(w - 300, 660), 58, 12);
  text("🏮 BUỔI TỐI · QUÁN ĂN CHỢ NỔI", 24, 24, { size: 11, bold: true, color: "#ffd46b" });
  text("⏱ " + fmtTime(snap.time_left_ticks), 24, 51, { size: 22, bold: true });

  text(`💰 ${snap.money ?? 0}k`, 128, 50, { size: 19, bold: true, color: "#ffe066" });
  const rep = snap.reputation ?? 0;
  const fullStars = Math.floor(rep);
  const starStr = "★".repeat(Math.max(0, Math.min(5, fullStars))) + "☆".repeat(Math.max(0, 5 - fullStars));
  text(`${starStr} ${rep.toFixed(1)}`, 235, 49, { size: 16, bold: true, color: "#ffca45" });
  text(`Điểm: ${snap.score ?? 0}`, 390, 49, { size: 16, bold: true, color: "#a8f5c8" });
  const handTxt = handDishId ? `Trên tay: ${dishName(handDishId, true)}` : "Trên tay: Trống";
  text(handTxt, 505, 49, { size: 12.5, bold: !!handDishId, color: handDishId ? "#ffe58f" : "#c7b296" });

  // Panel dưới: KHO KHẢ DỤNG (trái) + THỰC ĐƠN 3 MÓN (phải) căn giữa cân đối
  const { phys, res, avail } = computeStockBreakdown(snap);
  const footY = h - bottom + 10;
  const footH = bottom - 18;
  const totalW = Math.min(w - 20, 1120);
  const footX = (w - totalW) / 2;
  const leftW = Math.round((totalW - 10) * 0.45);
  const rightW = totalW - leftW - 10;

  // Trái: Kho khả dụng
  panel(footX, footY, leftW, footH, 12);
  text("📦 KHO KHẢ DỤNG (đã trừ phần khách giữ chỗ)", footX + 12, footY + 20, { size: 11, bold: true, color: "#ffd46b" });
  const ingList = ["ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"];
  const colW = (leftW - 24) / 4;
  ingList.forEach((k, i) => {
    const ix = footX + 12 + i * colW;
    const iy = footY + 32;
    roundRectPath(ix, iy, colW - 8, 50, 8);
    ctx.fillStyle = avail[k] > 0 ? "rgba(255,245,220,0.1)" : "rgba(0,0,0,0.28)";
    ctx.fill();
    ctx.strokeStyle = avail[k] > 0 ? "rgba(255,212,107,0.4)" : "rgba(255,255,255,0.1)";
    ctx.lineWidth = 1;
    ctx.stroke();
    drawIngredientIcon(ix + 18, iy + 25, 13, k);
    text(KIND_INFO[k].short, ix + 34, iy + 18, { size: 10.5, color: "#e8dac0" });
    text(`×${avail[k]}`, ix + 34, iy + 36, { size: 15, bold: true, color: avail[k] > 0 ? "#fff5d6" : "#8c7d6c" });
    if ((res[k] || 0) > 0) {
      text(`+${res[k]} giữ`, ix + colW - 14, iy + 36, { size: 9.5, align: "right", color: "#ffbe76" });
    }
  });

  // Phải: Thực đơn 3 món & khả năng nấu
  panel(footX + leftW + 10, footY, rightW, footH, 12);
  text("🍲 THỰC ĐƠN QUÁN MÁ TƯ  (vạch vàng 50% kiên nhẫn = có boa!)", footX + leftW + 22, footY + 20, { size: 11, bold: true, color: "#ffd46b" });
  const dishIds = ["ca_loc_nuong_trui", "goi_bong_sung", "lau_ca_linh_dien_dien"];
  const dColW = (rightW - 24) / 3;
  dishIds.forEach((did, i) => {
    const dinfo = DISH_INFO[did];
    const canCook = Object.keys(dinfo.recipe).every((rk) => (avail[rk] || 0) >= dinfo.recipe[rk]);
    const dx = footX + leftW + 22 + i * dColW;
    const dy = footY + 32;
    roundRectPath(dx, dy, dColW - 8, 50, 8);
    ctx.fillStyle = canCook ? "rgba(92, 214, 133, 0.14)" : "rgba(0,0,0,0.28)";
    ctx.fill();
    ctx.strokeStyle = canCook ? "rgba(126, 245, 162, 0.45)" : "rgba(255,255,255,0.1)";
    ctx.lineWidth = 1;
    ctx.stroke();
    drawDishIcon(dx + 18, dy + 25, 13, did);
    text(dinfo.short, dx + 35, dy + 18, { size: 10.5, bold: true, color: canCook ? "#fff5e1" : "#9c8e7c" });
    const recTxt = Object.keys(dinfo.recipe).map((rk) => `${KIND_INFO[rk].short}×${dinfo.recipe[rk]}`).join(" + ");
    text(recTxt, dx + 35, dy + 32, { size: 9.5, color: "#d6c3a5" });
    text(`${dinfo.price}k · ${dinfo.cook_s}s`, dx + 35, dy + 44, { size: 9.5, bold: true, color: canCook ? "#8bf59a" : "#8c7d6c" });
  });
}

// ---------- Hiệu ứng hạt & chữ bay dùng chung ----------
function updateEffects(dt) {
  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 28);
  if (toast) {
    toast.ttl -= dt;
    if (toast.ttl <= 0) toast = null;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.ttl -= dt;
    if (pt.ttl <= 0) { particles.splice(i, 1); continue; }
    pt.vy += pt.gravity * dt;
    pt.wx += pt.vx * dt;
    pt.wy += pt.vy * dt;
    if (pt.kind === "smoke") pt.r += dt * 7;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const fl = floaters[i];
    fl.ttl -= dt;
    if (fl.ttl <= 0) { floaters.splice(i, 1); continue; }
    fl.wy += (snap && snap.mode === "quan" ? 0.55 : -0.9) * dt;
  }
}

function drawWorldEffects(sx, sy) {
  particles.forEach((pt) => {
    const alpha = Math.max(0, pt.ttl / pt.maxTtl);
    ctx.save();
    ctx.globalAlpha = alpha;
    if (pt.kind === "bubble") {
      ctx.strokeStyle = pt.color;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(sx(pt.wx), sy(pt.wy), pt.r, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(sx(pt.wx), sy(pt.wy), pt.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  });
  floaters.forEach((fl) => {
    if (!fl.text) return;
    const alpha = Math.max(0, Math.min(1, (fl.ttl / fl.maxTtl) * 1.4));
    ctx.save();
    ctx.globalAlpha = alpha;
    text(fl.text, sx(fl.wx), sy(fl.wy), { size: fl.size, align: "center", bold: true, color: fl.color, shadow: true });
    ctx.restore();
  });
}

// ---------- Toast thoại Nam Bộ, Nhật ký sự kiện & Overlay kết thúc ----------
function drawToast(w) {
  if (!toast) return;
  const alpha = Math.min(1, toast.ttl * 2.5);
  ctx.save();
  ctx.globalAlpha = alpha;
  const tw = Math.min(460, Math.max(260, Math.max(toast.text.length, toast.sub.length) * 7.5 + 40));
  const tx = (w - tw) / 2, ty = 74;
  panel(tx, ty, tw, toast.sub ? 48 : 34, 14, "rgba(28, 17, 10, 0.92)", toast.color);
  text(`💬 ${toast.text}`, w / 2, ty + (toast.sub ? 19 : 21), { size: 13, align: "center", bold: true, color: toast.color });
  if (toast.sub) {
    text(toast.sub, w / 2, ty + 37, { size: 11, align: "center", color: "#f2e4cc" });
  }
  ctx.restore();
}

function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 52 ? s.slice(0, 49) + "…" : s; } catch (e) { return ""; }
}

function drawEventLog(w, h) {
  if (!showLog || !snap) return;
  const ev = (snap.events || []).slice(-8);
  const boxW = 360, boxH = 26 + ev.length * 16;
  const bx = w - boxW - 12, by = 52;
  panel(bx, by, boxW, boxH, 10, "rgba(14, 18, 22, 0.84)", "rgba(255,212,107,0.35)");
  text("NHẬT KÝ SỰ KIỆN (H để ẩn)", bx + 10, by + 16, { size: 10.5, bold: true, color: "#ffd46b" });
  ev.forEach((e, i) => {
    text(`t${e.tick} ${e.name} ${brief(e.data)}`, bx + 10, by + 32 + i * 16, { size: 10.5, color: "#dce6ed" });
  });
}

function drawOverlay(w, h) {
  if (offline) {
    panel(w / 2 - 200, 74, 400, 36, 10, "rgba(120, 20, 20, 0.92)", "#ff8a80");
    text("⚠ Mất kết nối tới máy chủ (python -m chonoi.live)", w / 2, 96, { align: "center", bold: true, color: "#ffdad6", size: 13 });
  }
  if (snap && snap.error) {
    panel(w / 2 - 220, 118, 440, 36, 10, "rgba(120, 20, 20, 0.92)", "#ff8a80");
    text("⚠ Luật mô phỏng báo lỗi — xem terminal. Nhấn R chơi lại.", w / 2, 140, { align: "center", bold: true, color: "#ffdad6", size: 13 });
  }
  if (snap && snap.finished) {
    ctx.fillStyle = "rgba(8, 10, 14, 0.62)";
    ctx.fillRect(0, 0, w, h);
    const mw = 440, mh = 230;
    const mx = (w - mw) / 2, my = (h - mh) / 2;
    panel(mx, my, mw, mh, 16, "rgba(34, 21, 12, 0.96)", "#ffd46b");
    const isGather = snap.mode === "gather";
    text(isGather ? "☀ KẾT THÚC BUỔI SÁNG" : "🏮 KẾT THÚC CA TỐI", w / 2, my + 38, { size: 22, align: "center", bold: true, color: "#ffd46b" });
    text(REASON_VI[snap.reason] || `Lý do: ${snap.reason || "xong"}`, w / 2, my + 66, { size: 14, align: "center", color: "#fff5e1" });

    if (isGather) {
      const counts = {};
      (snap.hold || []).forEach((k) => { counts[k] = (counts[k] || 0) + 1; });
      const items = Object.keys(counts);
      text("Nguyên liệu mang về quán:", w / 2, my + 104, { size: 12.5, align: "center", color: "#d6c3a5" });
      if (items.length === 0) {
        text("(Kho rỗng)", w / 2, my + 132, { size: 15, align: "center", bold: true, color: "#ff9e80" });
      } else {
        const line = items.map((k) => `${kindName(k)} ×${counts[k]}`).join("  ·  ");
        text(line, w / 2, my + 132, { size: 15, align: "center", bold: true, color: "#a8f5c8" });
      }
      text("Mẹo: Dùng --inventory-out kho.json rồi mở --mode quan --inventory kho.json", w / 2, my + 166, { size: 10.5, align: "center", color: "#c2ae91" });
    } else {
      text(`Doanh thu: ${snap.money ?? 0}k   ·   Uy tín: ${(snap.reputation ?? 0).toFixed(1)} ★`, w / 2, my + 114, { size: 16, align: "center", bold: true, color: "#ffe066" });
      text(`TỔNG ĐIỂM: ${snap.score ?? 0}`, w / 2, my + 150, { size: 22, align: "center", bold: true, color: "#8bf59a" });
    }
    text("Nhấn [R] hoặc bấm nút 'Chơi lại' ở góc trên để bắt đầu lượt mới", w / 2, my + mh - 24, { size: 12, align: "center", color: "#e8d6b8" });
  }
}

// ---------- Vòng lặp render ----------
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastFrameTs) / 1000));
  lastFrameTs = ts;
  animTime += dt;
  updateEffects(dt);

  const [w, h] = fit();
  ctx.fillStyle = "#0d161b";
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  if (screenShake > 0.1) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h);
    else drawGather(w, h);
    drawToast(w);
    drawEventLog(w, h);
    drawOverlay(w, h);
  } else {
    text(offline ? "Không kết nối được tới máy chủ…" : "Đang vào Chợ Nổi Rạch Sen…", w / 2, h / 2, {
      align: "center",
      size: 18,
      color: "#ffd46b",
    });
  }
  ctx.restore();
}
requestAnimationFrame(frame);
</script>
